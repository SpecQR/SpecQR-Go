name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.8', '1.27.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOPROXY: 'off'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Toolchain and pinned Unicode data
        run: |
          go version
          python tools/generate_idna_profile.py --check
      - name: Normal tests and examples
        run: go test -count=1 ./...
      - name: Debug unoptimized tests
        run: go test -count=1 -gcflags=all="-N -l" ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Reproducible archive, installed CLI and clean module consumer
        run: python tools/verify_package.py
      - name: Package documentation
        run: go doc -all .
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
  run32:
    name: Go ${{ matrix.go }} / Linux 386 execution
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.8', '1.27.1']
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOPROXY: 'off'
      PYTHONUTF8: '1'
      GOARCH: '386'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -count=1 ./...
      - run: go build ./cmd/specqr
  fuzz:
    name: Bounded fuzz and CGO-free build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOPROXY: 'off'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Fuzz public inputs
        run: |
          go test -run='^$' -fuzz='^FuzzPublicAPINoPanic$' -fuzztime=10s -parallel=2 .
          go test -run='^$' -fuzz='^FuzzMergeNoPanic$' -fuzztime=10s -parallel=2 .
          go test -run='^$' -fuzz='^FuzzCorePublicInputs$' -fuzztime=10s -parallel=2 .
          go test -run='^$' -fuzz='^FuzzSegmentsPublicInputs$' -fuzztime=10s -parallel=2 .
          go test -run='^$' -fuzz='^FuzzGS1Helpers$' -fuzztime=10s -parallel=2 .
          go test -run='^$' -fuzz='^FuzzGS1URLAdapter$' -fuzztime=10s -parallel=2 .
      - run: CGO_ENABLED=0 go test -count=1 ./...
  independent:
    name: Seven independent lanes / source and module consumer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: echo "NODE_24_19=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - run: echo "NODE_24_21=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: SpecQR/SpecQR
          ref: 15ad15e5c770ea0e39072f8f88b2733018f02ffd
          path: .baseline/SpecQR
      - name: Install pinned development oracles
        run: npm ci --prefix tools/verification --ignore-scripts
      - name: Seven source lanes
        run: python tools/verification/run_all.py --baseline .baseline/SpecQR --node "$NODE_24_19" --node-24-19 "$NODE_24_19" --node-24-21 "$NODE_24_21" --cpp-dependency-dir .tools/zxing-cpp --java-dependency-dir .tools/zxing-java --reports artifacts/source --summary artifacts/source-summary.json
      - name: Reproducible package and detached source
        run: |
          python tools/verify_package.py --archive artifacts/source.zip --output artifacts/package.json
          python -c "import zipfile; zipfile.ZipFile('artifacts/source.zip').extractall('../specqr-package')"
          python tools/verification/build_consumer.py --candidate ../specqr-package/SpecQR-Go --consumer-dir ../specqr-module-consumer --output artifacts/module-consumer.json
      - name: Seven clean module-consumer lanes
        run: python tools/verification/run_all.py --candidate ../specqr-package/SpecQR-Go --binary ../specqr-module-consumer/conformance-consumer --baseline .baseline/SpecQR --node "$NODE_24_19" --node-24-19 "$NODE_24_19" --node-24-21 "$NODE_24_21" --cpp-dependency-dir .tools/zxing-cpp --java-dependency-dir .tools/zxing-java --no-install --reports artifacts/consumer --summary artifacts/consumer-summary.json
      - name: Record Java default-scale-8 compatibility diagnostic separately
        run: |
          set +e
          python tools/verification/verify_decoders.py --decoder java --dependency-dir .tools/zxing-java --no-install --png-scale 8 --output artifacts/java-default-scale8.json
          result=$?
          set -e
          test "$result" -eq 1
          python tools/verification/summarize_default_scale.py --candidate . --report artifacts/java-default-scale8.json --output artifacts/java-default-scale8-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: independent-verification
          path: artifacts/
